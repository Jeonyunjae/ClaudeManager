<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YJ Manager — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg-page: #E8ECEF;
    --bg-card: #FFFFFF;
    --bg-dark: #10141A;
    --text-primary: #10141A;
    --text-secondary: #6B7280;
    --text-tertiary: #9CA3AF;
    --border-light: #E5E7EB;
    --accent-purple: #7C5CFC;
    --accent-purple-hover: #6D4FE0;
    --status-error: #EF4444;
    --shadow-card: 0 4px 24px rgba(0,0,0,0.08);
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.12);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Background */
  .bg-pattern {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse at 20% 50%, rgba(124,92,252,0.15) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(59,130,246,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 60% 80%, rgba(52,211,153,0.08) 0%, transparent 50%);
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Login Card */
  .login-card {
    position: relative; z-index: 1;
    width: 400px; background: var(--bg-card);
    border-radius: 24px; box-shadow: var(--shadow-lg);
    padding: 48px 40px;
    text-align: center;
  }

  .login-logo {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-bottom: 8px;
  }
  .login-logo-icon {
    width: 48px; height: 48px; border-radius: 14px;
    background: var(--bg-dark); color: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800;
    box-shadow: 0 4px 12px rgba(16,20,26,0.3);
  }
  .login-logo-text {
    font-size: 22px; font-weight: 700; color: var(--text-primary);
    letter-spacing: -0.02em;
  }
  .login-subtitle {
    font-size: 13px; color: var(--text-tertiary); margin-bottom: 36px;
  }

  .login-form {
    display: flex; flex-direction: column; gap: 16px;
  }

  .input-group {
    text-align: left;
  }
  .input-label {
    font-size: 12px; font-weight: 500; color: var(--text-secondary);
    margin-bottom: 6px; display: block;
  }
  .input-wrapper {
    position: relative;
  }
  .input-icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-tertiary);
  }
  .input-field {
    width: 100%; padding: 12px 14px 12px 42px;
    border: 1.5px solid var(--border-light); border-radius: 12px;
    font-size: 14px; font-family: inherit; outline: none;
    transition: all 0.15s;
    background: #FAFBFC;
  }
  .input-field:focus {
    border-color: var(--accent-purple);
    box-shadow: 0 0 0 3px rgba(124,92,252,0.1);
    background: white;
  }
  .input-field.error {
    border-color: var(--status-error);
    box-shadow: 0 0 0 3px rgba(239,68,68,0.1);
  }
  .input-toggle {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-tertiary);
    cursor: pointer; padding: 4px;
  }

  .login-btn {
    width: 100%; padding: 13px;
    background: var(--accent-purple); color: white;
    border: none; border-radius: 12px;
    font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: all 0.15s;
    margin-top: 4px;
    box-shadow: 0 4px 12px rgba(124,92,252,0.25);
  }
  .login-btn:hover {
    background: var(--accent-purple-hover);
    box-shadow: 0 6px 16px rgba(124,92,252,0.35);
    transform: translateY(-1px);
  }
  .login-btn:active { transform: translateY(0); }

  .error-message {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 14px; border-radius: 10px;
    background: #FEF2F2; color: #991B1B;
    font-size: 12px; font-weight: 500;
    text-align: left;
  }
  .error-message svg { flex-shrink: 0; }
  .error-hidden { display: none; }

  .login-footer {
    margin-top: 24px; font-size: 11px; color: var(--text-tertiary);
  }

  /* Floating elements */
  .float-badge {
    position: fixed; z-index: 0;
    padding: 6px 14px; border-radius: 10px;
    font-size: 11px; font-weight: 500;
    background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.3);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .float-1 { top: 15%; left: 8%; transform: rotate(-5deg); }
  .float-2 { top: 25%; right: 10%; transform: rotate(3deg); }
  .float-3 { bottom: 20%; left: 12%; transform: rotate(2deg); }
  .float-4 { bottom: 30%; right: 8%; transform: rotate(-3deg); }
</style>
</head>
<body>

<div class="bg-pattern"></div>
<div class="bg-grid"></div>

<!-- Floating badges -->
<div class="float-badge float-1">Main · Active</div>
<div class="float-badge float-2">개발팀 · 60%</div>
<div class="float-badge float-3">claude-opus-4</div>
<div class="float-badge float-4">Agent Journeys</div>

<!-- Login Card -->
<div class="login-card">
  <div class="login-logo">
    <div class="login-logo-icon">YJ</div>
    <span class="login-logo-text">YJ Manager</span>
  </div>
  <div class="login-subtitle">AI 에이전트 오케스트레이션 플랫폼</div>

  <div class="login-form">
    <div class="input-group">
      <label class="input-label">비밀번호</label>
      <div class="input-wrapper">
        <span class="input-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <input class="input-field" type="password" placeholder="비밀번호를 입력하세요" value="••••••••" />
        <button class="input-toggle">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- Error Message (toggle visibility for demo) -->
    <div class="error-message error-hidden" id="errorMsg">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      비밀번호가 올바르지 않습니다. 3회 실패 시 5분간 잠금됩니다.
    </div>

    <button class="login-btn" onclick="toggleError()">로그인</button>
  </div>

  <div class="login-footer">
    개인 서버 전용 · 단일 사용자 인증
  </div>
</div>

<script>
function toggleError() {
  const el = document.getElementById('errorMsg');
  el.classList.toggle('error-hidden');
  document.querySelector('.input-field').classList.toggle('error');
}
</script>

</body>
</html>
