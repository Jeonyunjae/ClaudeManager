services:
  postgres:
    image: postgres:17-alpine
    container_name: claudemanager-db
    environment:
      POSTGRES_DB: claudemanager
      POSTGRES_USER: claudemanager
      POSTGRES_PASSWORD: claudemanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
